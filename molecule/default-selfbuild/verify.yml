---
- name: Verify self-built Owncast
  hosts: all
  become: true
  gather_facts: false

  vars:
    owncast_verify_base_url: "http://localhost:{{ owncast_container_http_host_bind_port }}"

    # Owncast ships with a well-known administrator password and a well-known
    # default stream key, both `abc123`. This role currently offers no way to
    # change either of them (Owncast only accepts them as command line flags,
    # which the role does not pass), so a deployment made by this role answers
    # to them. That is precisely why the probes below cannot stop at "the admin
    # API accepted our password": they also check that a *wrong* password is
    # refused, so that an Owncast which had stopped checking credentials
    # altogether could not pass.
    owncast_verify_admin_username: admin
    owncast_verify_admin_password: abc123

    owncast_verify_wrong_admin_password: not-the-owncast-admin-password
    owncast_verify_wrong_stream_key: not-the-owncast-stream-key

    # These requests authenticate through an explicit header rather than through
    # the `url_password` option, which must not be used here.
    #
    # Owncast's default administrator password and its default stream key are
    # the same string. `url_password` is a `no_log` option, so Ansible registers
    # whatever it is given as a secret and redacts that literal from everything
    # that follows - including the stream key that the RTMP probes further down
    # are handed on their command line, which then reaches Owncast as
    # `VALUE_SPECIFIED_IN_NO_LOG_PARAMETER` and is rejected as invalid.
    owncast_verify_admin_auth_header: >-
      Basic {{ (owncast_verify_admin_username + ':' + owncast_verify_admin_password) | b64encode }}
    owncast_verify_wrong_auth_header: >-
      Basic {{ (owncast_verify_admin_username + ':' + owncast_verify_wrong_admin_password) | b64encode }}

  tasks:
    - name: Run the shared Owncast verification
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/verify_tasks.yml"
